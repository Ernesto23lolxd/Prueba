# 👉 Receta para Render (el hosting). Dice cómo instalar (pip install), cómo arrancar (uvicorn) y las variables.
# 👉 Los secretos (GEMINI_API_KEY y DATABASE_URL) NO van aquí: se ponen a mano en el panel de Render.
# Despliegue de STOCK en Render (Blueprint). Render toma el código de GitHub (rama main) y lo publica.
# Cada push a main vuelve a desplegar solo. La base de datos vive en Supabase (DATABASE_URL).
services:
  - type: web
    name: stock-tienda
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Secretos: Render los pide al crear el servicio (nunca se guardan en GitHub)
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Render pone un proxy delante: así el límite por IP usa la IP real de cada usuario
      - key: CONFIAR_PROXY
        value: "1"
      - key: RATE_LIMIT_POR_MINUTO
        value: "25"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # La app se sirve desde el mismo dominio; si cambias el nombre del servicio, cambia esta URL
      - key: ALLOWED_ORIGINS
        value: https://stock-tienda.onrender.com
      # La tienda arranca en ceros ("vacio"). Con "demo" arranca con la tiendita de ejemplo.
      - key: INVENTARIO_INICIAL
        value: vacio
      # Menú ⋯ → "Empezar de cero" / "Cargar tienda de ejemplo". Ponlo en "0" cuando sea una tienda real.
      - key: PERMITIR_RESET
        value: "1"
